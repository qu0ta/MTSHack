name: mtshack

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-mtshack}:${POSTGRES_PASSWORD:-mtshack}@postgres:5432/${POSTGRES_DB:-mtshack}?sslmode=disable
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped

  ml-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    env_file:
      - ./ai/.env
    environment:
      KB_PATH: /opt/mtshack/knowledge-base.zip
      ML_MODULE: app.ml.rag_api
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ML_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtshack}
      POSTGRES_USER: ${POSTGRES_USER:-mtshack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtshack}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-mtshack}:${POSTGRES_PASSWORD:-mtshack}@postgres:5432/${POSTGRES_DB:-mtshack}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
