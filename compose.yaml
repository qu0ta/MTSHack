services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtshack-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mtshack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtshack}
      POSTGRES_USER: ${POSTGRES_USER:-mtshack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtshack} -d ${POSTGRES_DB:-mtshack}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
