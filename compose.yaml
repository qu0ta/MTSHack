name: mtshack

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-mtshack}:${POSTGRES_PASSWORD:-mtshack}@postgres:5432/${POSTGRES_DB:-mtshack}?sslmode=disable
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtshack}
      POSTGRES_USER: ${POSTGRES_USER:-mtshack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtshack}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-mtshack}:${POSTGRES_PASSWORD:-mtshack}@postgres:5432/${POSTGRES_DB:-mtshack}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ml-service:
    image: wiremock/wiremock:3.13.1-alpine
    command: ["--port", "8000", "--disable-banner"]
    ports:
      - "${ML_PORT:-8000}:8000"
    volumes:
      - ./docker/ml-mock:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
